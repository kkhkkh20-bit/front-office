<title>단장의 시간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 매니지먼트 게임 화면 — 상단 구단 바와 '계속' 버튼, 넓은 화면은 왼쪽 메뉴·휴대폰은 아래 아이콘 메뉴, 내용은 헤더 띠가 붙은 촘촘한 패널과 표 */
:root{
  --bg:#0d1217; --panel:#141b22; --panel2:#1a232c; --head:#1f2a35; --line:#26313c; --line2:#334250;
  --ink:#e2e8ed; --muted:#8a98a6; --dim:#5d6b79;
  --team:#2a5f9e; --team-hi:#3d7cc7; --team-dk:#173352;
  --go:#23874a; --go-hi:#2c9a57; --acc:#3d8bfd; --acc-hi:#5a9dff;
  --good:#4fc27c; --bad:#ef6b5e; --warn:#e3b44c;
  --r20:#b4392e; --r35:#d0712a; --r45:#c9a62c; --r50:#97b83a; --r55:#3fa859; --r65:#1e9eb0; --r75:#4c8ff0;
  --grass:#16301f; --grass2:#1b3a26; --dirt:#3d3022; --chalk:#cfd8de; --node:#141b22f0;
  --scrim:rgba(0,0,0,.6);
  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-num:'Barlow Condensed','Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.45 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--team-dk)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--team-hi);outline-offset:1px}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 셸 */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--team-dk);border-bottom:2px solid var(--team-hi)}
.top .tbar{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px}
.top .club{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .club>div{min-width:0}
.top .club b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club span{display:block;font-size:12px;color:#c9d4de;white-space:nowrap}
.mailbtn{position:relative;border:0;background:#ffffff12;border-radius:4px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#e6edf2}
.mailbtn i{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:700 11px/16px var(--f-num);font-style:normal;padding:0 3px}
.goset{display:flex;align-items:stretch}
.goset .step{border:0;background:#ffffff14;color:#dce5ec;font:600 13px var(--f-num);padding:0 8px;cursor:pointer;border-right:1px solid #00000040;letter-spacing:.02em}
.goset .step:first-child{border-radius:4px 0 0 4px}
.goset .continue{border:0;background:var(--go);color:#fff;font:700 16px var(--f-ui);padding:0 14px;min-height:40px;border-radius:0 4px 4px 0;cursor:pointer;display:flex;align-items:center;gap:6px}
.goset .continue:hover{background:var(--go-hi)}
.goset button[disabled]{opacity:.45;cursor:not-allowed}
.blk{background:#3a1c1a;color:#ffd2cc;font-size:13px;padding-block:6px;border-bottom:1px solid #5a2a26}
.blk button{all:unset;cursor:pointer;text-decoration:underline;margin-left:6px;font-weight:700}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px}
.subhead h1{margin:0;font:700 18px var(--f-ui);letter-spacing:-.01em}
.subhead .meta{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;min-width:0;align-items:center}.subhead .meta .chipn{white-space:nowrap}
.chipn{font:600 12px var(--f-num);letter-spacing:.03em;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 7px;white-space:nowrap}
.chipn b{color:var(--ink)}
main.content{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-block:6px 96px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0f13;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{display:grid;grid-template-columns:repeat(6,1fr)}
.bnav button{border:0;background:none;color:var(--dim);display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;cursor:pointer;position:relative}
.bnav button.on{color:var(--ink)}
.bnav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--team-hi)}
.bnav .dot{position:absolute;top:6px;left:56%;width:7px;height:7px;border-radius:50%;background:var(--bad)}
@media (max-width:420px){ .goset .step{padding:0 6px} .goset .continue{padding:0 10px} .top .club span{font-size:11px} }
@media (min-width:980px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:#0a0f13;border-right:1px solid var(--line);padding:14px 0}
  .rail .brand{display:flex;gap:10px;align-items:center;padding:0 16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .rail .brand b{font-size:14px;line-height:1.25}
  .rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 18px;color:var(--muted);font-size:14px;position:relative}
  .rail button:hover{background:#ffffff08;color:var(--ink)}
  .rail button.on{color:var(--ink);background:#ffffff0d;box-shadow:inset 3px 0 0 var(--team-hi)}
  .rail button .cnt{margin-left:auto;font:700 11px var(--f-num);background:var(--bad);color:#fff;border-radius:8px;padding:0 6px}
  .bnav{display:none}
  main.content{padding-block:8px 40px}
  .wrap{max-width:1180px;margin:0 auto;width:100%}
  .twopane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:start}
}
.wrap{width:100%}

/* 패널 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.card>h2.sec:first-child,.card>.row.between:first-child,.card>.eyebrow:first-child,details.card>summary{margin:-12px -12px 2px;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line);border-radius:4px 4px 0 0;min-height:38px}
.card.hero{border-color:var(--team)}
.card.hero>h2.sec:first-child,.card.hero>.row.between:first-child,.card.hero>.eyebrow:first-child{background:color-mix(in srgb,var(--team) 45%,var(--panel));border-bottom-color:var(--team-hi);color:#fff}
.card.hero>.row.between:first-child .eyebrow,.card.hero>.eyebrow:first-child{color:#e8eef3}
.sec{margin:0;font:700 14px var(--f-ui);letter-spacing:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;flex:none}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>summary>span:not(.sec){margin-left:auto}
details.card:not([open]){gap:0}
details.card:not([open])>summary{margin-bottom:-12px;border-bottom:0;border-radius:4px}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel2);border-radius:4px;padding:5px 11px;font-weight:500;cursor:pointer;min-height:34px;font-size:14px;color:var(--ink)}
.btn:hover{background:#243039}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.btn.primary:hover{background:var(--acc-hi)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{min-height:28px;padding:3px 8px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:1px 6px;border-radius:2px;background:#ffffff12;color:var(--ink);white-space:nowrap;vertical-align:1px}
.pill.good{color:var(--good);background:#4fc27c1c} .pill.bad{color:var(--bad);background:#ef6b5e1c} .pill.warn{color:var(--warn);background:#e3b44c1c} .pill.acc{color:#9cc4f2;background:#3d7cc726}
.list{display:grid;margin:0 -12px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:7px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.list>.item:first-child{border-top:0}
.list>.item:nth-child(even){background:#ffffff04}
.item:hover{background:#ffffff0a!important}
.item .nm{font-weight:500;min-width:0}
.item .sub{font-size:12px;color:var(--muted);grid-column:1;min-width:0}
.item .rt{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:13px}
.item.wa{grid-template-columns:auto minmax(0,1fr) auto}
.item.wa>.av,.item.wa>.badge{grid-row:1 / span 2;grid-column:1}
.item.wa>.nm,.item.wa>.sub{grid-column:2}
.item.wa>.rt{grid-column:3}
.tw{overflow-x:auto;margin:0 -12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td{font-family:var(--f-num);font-size:14px;letter-spacing:.02em}
th{font-weight:500;color:var(--muted);font-size:11px;background:var(--head);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;padding-left:12px}
td:first-child{font-family:var(--f-ui);font-size:13px}
tbody tr:nth-child(even) td{background:#ffffff04}
tbody tr:hover td{background:#ffffff0a}
tr.me td{background:#3d7cc71f!important;font-weight:600}
td.key,th.key{font-weight:700;color:var(--ink)}
tr.click{cursor:pointer}
.tname{display:inline-flex;align-items:center;gap:6px}
.bar{height:8px;border-radius:2px;background:#0b1014;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.bar i.over{background:var(--bad)}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 8px;display:grid}
.tile .g{font:700 24px/1.1 var(--f-num);letter-spacing:.02em}
.tile .l{font-size:11px;color:var(--muted)}
.tile.key{border-color:var(--team-hi);box-shadow:inset 0 2px 0 var(--team-hi)}
.rc{display:inline-block;min-width:28px;text-align:center;font:700 14px/20px var(--f-num);color:#071014;background:var(--c,#556);border-radius:2px;padding:0 3px}
.rc.q{background:#2a3642;color:var(--muted)}
.tools{display:grid;gap:6px}
.tool{display:grid;grid-template-columns:56px 30px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.tool .track{position:relative;height:8px;border-radius:2px;background:#0b1014;border:1px solid var(--line)}
.tool .track .now{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.tool .track .fut{position:absolute;left:0;top:-1px;bottom:-1px;border:1px dashed var(--c2,var(--muted));border-left:0;opacity:.9}
.tool .track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim)}
.quote{border-left:3px solid var(--team-hi);padding:2px 0 2px 10px;display:grid;gap:4px;font-size:14px;color:#cfd8e0}
.seg{display:flex;background:#0b1014;border:1px solid var(--line);border-radius:3px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:2px;padding:6px 6px;font-weight:500;cursor:pointer;min-height:34px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--team-hi)}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line2);background:var(--panel2);border-radius:3px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--team-hi)}
.check .sub{grid-column:2;font-size:12px;color:var(--muted)}
.note{font-size:13px;padding:8px 10px;border-radius:3px;background:var(--panel2);border-left:3px solid var(--line2)}
.note.bad{color:#ffc8c1;border-left-color:var(--bad)} .note.good{color:#c4f0d3;border-left-color:var(--good)} .note.warn{color:#ffe0a8;border-left-color:var(--warn);margin-bottom:8px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:stretch;justify-content:flex-end}
.sheet{background:var(--bg);width:100%;max-width:620px;height:100%;overflow-y:auto;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;grid-auto-rows:max-content;animation:sl .18s ease-out;border-left:1px solid var(--line)}
@keyframes sl{from{transform:translateX(24px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-inline:calc(-1 * max(12px,env(safe-area-inset-left,0px))) calc(-1 * max(12px,env(safe-area-inset-right,0px)));padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));background:var(--pt,var(--team-dk));border-bottom:2px solid var(--pt2,var(--team-hi))}
.sheet-head .eyebrow{color:#d5dee6}
.sheet-head h2{font-size:20px!important}
.x{border:0;background:#00000030;color:#fff;border-radius:3px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--team-hi)}
select{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:3px;padding:4px 8px;min-height:32px;max-width:100%}
.av{width:40px;height:40px;border-radius:3px;background:#1d2833;border:1px solid var(--line);flex:none;object-fit:contain;object-position:50% 50%;display:inline-grid;place-items:center;font-weight:700;color:var(--muted);font-size:15px}
.av.big{width:84px;height:84px;font-size:28px;border-color:#ffffff30}
.badge{flex:none;display:inline-block;vertical-align:middle}
.teams{display:grid;gap:6px}
.tpick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer;text-align:left;width:100%;color:inherit}
.tpick:hover{border-color:var(--line2);background:var(--panel2)}
.tpick .badge{grid-row:1 / span 2}
.tpick .sub{font-size:12px;color:var(--muted)}
.log{display:grid;gap:4px;font-size:13px}
.ticker{font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.03em}
.field{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.field .pos{cursor:pointer}
.field .pos rect.box{fill:var(--node);stroke:var(--line2);stroke-width:1}
.field .pos:hover rect.box,.field .pos:focus rect.box{stroke:var(--team-hi);stroke-width:2}
.field .pos.ov rect.box{stroke:var(--warn)}
.field text{fill:var(--ink);font-family:var(--f-ui)}
.field .pl{font-size:9.5px;fill:var(--muted)}
.field .pn{font-size:11.5px;font-weight:700}
.field .ps{font-size:9.5px;font-family:var(--f-num);fill:#b9c6d1}
.field .bd{fill:var(--team-hi)} .field .bdt{fill:#fff;font-size:10px;font-weight:700;font-family:var(--f-num)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:3px}.months .tot{border-color:var(--acc)}.months .tot b{color:var(--acc)}
.months div{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:4px 2px;text-align:center;font-size:11px;color:var(--muted)}
.months b{display:block;font:700 14px var(--f-num);color:var(--ink)}
.adv{display:none}
.lnk{all:unset;cursor:pointer;font-weight:500}
.lnk:hover{text-decoration:underline}
table.ls td,table.ls th{text-align:center;padding:5px 3px;min-width:20px}
table.ls td:first-child,table.ls th:first-child{text-align:left;padding-left:12px}
.mail{border-left:3px solid transparent!important}
.mail .nm{font-weight:400;color:#c8d2db}
.mail.unread{border-left-color:var(--team-hi)!important}
.mail.unread .nm{font-weight:700;color:var(--ink)}
.mail.sel{background:#3d7cc71a!important}
.mailbody{display:grid;gap:10px;font-size:16px;line-height:1.7;color:#d6dee5}
.talk{display:flex;flex-wrap:wrap;gap:5px}
.talk .btn.on{background:var(--team);border-color:var(--team-hi);color:#fff}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px -12px;width:auto}
.sqt td{padding-block:5px}
.sqt .pn{display:flex;align-items:center;gap:8px;min-width:130px}
.sqt .pn .av{width:30px;height:30px}
.sqt .grp td{background:var(--head)!important;color:var(--muted);font:500 12px var(--f-ui);padding-block:5px}
.mood{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.start-hero{display:grid;gap:10px;padding-block:28px 10px}
.start-hero h1{margin:0;font:700 28px var(--f-ui);letter-spacing:-.02em}
.start-hero .kicker{font:600 13px var(--f-num);letter-spacing:.12em;color:var(--team-hi)}

/* 트레이드 테이블 */
.tstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tstrip button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:6px 10px 6px 7px;cursor:pointer;color:var(--ink);text-align:left}
.tstrip button span{display:grid;line-height:1.2}.tstrip b{font-size:13px}.tstrip i{font-style:normal;font-size:11px;color:var(--muted)}
.tstrip button.on{border-color:var(--team-hi);box-shadow:inset 0 -2px 0 var(--team-hi);background:#ffffff0d}
.tlay{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
@media(min-width:980px){.tlay{grid-template-columns:minmax(300px,360px) minmax(0,1fr);align-items:start}.tboard{position:sticky;top:76px}}
.tcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media(min-width:980px){.tcols{grid-template-columns:minmax(0,1fr)}}
.tcols>div{background:#0b1014;border:1px solid var(--line);border-radius:3px;padding:7px;display:grid;gap:5px;align-content:start;min-height:84px;min-width:0}

.fpip{display:inline-flex;gap:3px;flex:none;margin-top:4px;align-items:center}.fpip em{font:600 11px var(--f-num);font-style:normal;color:var(--muted);margin-left:3px}.fpip i{width:14px;height:6px;border-radius:2px;background:var(--line2)}.fpip i.on{background:var(--good)}.fpip i.bld{background:var(--warn)}
.fci .tc-ft{flex-wrap:wrap;gap:6px}.fci .tc-ft .btn{margin-left:auto}
svg.campus{display:block;width:100%;height:auto;border-radius:6px}.campst{margin:8px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#3c8a4f;touch-action:manipulation}
svg.campus .pt{font:700 11px var(--f-ui);fill:#fff}svg.campus .pl{font:500 10px var(--f-ui);fill:#f2f4f6;paint-order:stroke;stroke:#0008;stroke-width:2px}svg.campus .pl.dk{fill:#3b4650;stroke:none}
svg.campus .sb{font:700 11px var(--f-ui);fill:#ffd24d}svg.campus .cpn{font:600 9px var(--f-ui);fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000b;stroke-width:2.4px;pointer-events:none}
svg.campus .cpp{cursor:pointer}svg.campus .cpp:hover .cpn{fill:#ffd24d}
.cpchips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.cpchips .chip{background:var(--panel2,#18212a);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px}.cpchips .chip.r b{color:var(--bad)}.cpchips .chip.y b{color:var(--warn)}.cpchips .chip.g b{color:var(--good)}
.fci.flash{box-shadow:0 0 0 2px var(--warn)}
.clbar{position:relative;height:10px;border-radius:5px;margin:14px 0 18px;background:linear-gradient(90deg,#d6333f 0%,#d6333f 30%,#8a8f96 40%,#1fa463 45%,#1fa463 65%,#8a8f96 70%,#e0a100 80%,#e0a100 100%)}
