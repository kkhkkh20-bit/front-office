name: 배포

# main에 합쳐지면 Cloudflare Workers로 바로 배포한다.
# Cloudflare 쪽 Git 자동 빌드가 대기열에 멈춰도 이 작업이 배포를 마친다(같은 커밋을 두 번 올려도 결과는 같다).
# 필요한 저장소 secret: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare 배포 (wrangler.jsonc의 build 명령 포함)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: 반영 확인 (release.json commit)
        run: |
          want=$(echo "$GITHUB_SHA" | cut -c1-12)
          for i in $(seq 1 20); do
            got=$(curl -fsS https://fronttime.kkhkkh-20.workers.dev/release.json | grep -o '"commit": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{12\}' || true)
            echo "기대 $want / 지금 $got"
            [ "$got" = "$want" ] && exit 0
            sleep 15
          done
          echo "::error::배포 뒤 5분이 지나도 release.json commit이 바뀌지 않았습니다"
          exit 1
