name: 점검

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 점검 도구 설치
        working-directory: tools
        run: npm ci --no-audit --no-fund
      - name: 규칙 점검
        env:
          RULE_SHARD: ${{ matrix.shard }}/8
          NODE_PATH: tools/node_modules
        run: |
          bash build.sh --engine-out dist/engine.js
          node tools/check-logic.js
  browser-and-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 화면 점검이 늘어 느린 러너에서 60분을 넘김
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 기준 커밋과 비교하는 점검(git show)이 있어 전체 이력이 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 점검 도구 설치
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 빌드·브라우저·시즌 시뮬레이션
        env:
          QUICK: "1"
          SKIP_RULE_CHECK: "1"
          NODE_PATH: tools/node_modules
        run: bash tools/check.sh
  check:
    if: always()
    needs: [rules, browser-and-sim]
    runs-on: ubuntu-latest
    steps:
      - name: 전체 점검 결과
        env:
          RULES_RESULT: ${{ needs.rules.result }}
          BROWSER_RESULT: ${{ needs.browser-and-sim.result }}
        run: test "$RULES_RESULT" = success && test "$BROWSER_RESULT" = success
