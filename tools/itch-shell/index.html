<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프런트타임</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #fb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}
  #fb a{color:#58a6ff}
</style>
</head>
<body>
<!-- 프런트타임 itch 껍데기: 게임 본체는 고정 주소(Cloudflare)에 있다. 업데이트해도 주소가 그대로라 저장이 유지된다.
     처음 한 번, 이 itch 주소에 남아 있던 예전 저장(danjang-로 시작하는 항목)을 본체로 보내 옮긴다. -->
<iframe id="g" src="https://fronttime.kkhkkh-20.workers.dev/" allow="fullscreen; autoplay; clipboard-write" allowfullscreen title="프런트타임"></iframe>
<div id="fb">게임을 불러오지 못했습니다.<br><a href="https://fronttime.kkhkkh-20.workers.dev/" target="_blank" rel="noopener">새 탭에서 열기</a></div>
<script>
(function(){
  var GAME='https://fronttime.kkhkkh-20.workers.dev';
  var f=document.getElementById('g'), sent=0;
  function items(){ var o={}, n=0; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(/^danjang-/.test(k)){ o[k]=localStorage.getItem(k); n++; } } }catch(e){} return n?o:null; }
  function send(){ try{ if(localStorage.getItem('ft-migrated')==='1')return; }catch(e){} var it=items(); if(!it||sent>5)return; sent++; try{ f.contentWindow.postMessage({type:'ft-migrate',items:it},GAME); }catch(e){} }
  f.addEventListener('load',function(){ send(); setTimeout(send,1500); setTimeout(send,4000); });
  window.addEventListener('message',function(e){ if(e.origin===GAME&&e.data&&e.data.type==='ft-migrated'){ try{ localStorage.setItem('ft-migrated','1'); }catch(x){} } });
})();
</script>
</body>
</html>
