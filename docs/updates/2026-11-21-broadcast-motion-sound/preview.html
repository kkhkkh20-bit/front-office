<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사운드 비교</title><style>body{margin:0;padding:24px;background:#101820;color:#eaf0f4;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption,p{color:#afc1cf}figcaption{padding:10px 0}audio{width:100%}@media(max-width:700px){body{padding:12px}.pair{grid-template-columns:1fr}}</style><main><h1>사운드 비교</h1><p>미배포 · 타자 자세는 기존 유지</p><p>같은 효과음 구성 · 4초에 정지</p><div class="pair"><figure><figcaption>기존</figcaption><audio controls preload="metadata" src="previews/sound-before.mp3"></audio></figure><figure><figcaption>개선 · 함성 겹침과 정지 뒤 잔향 정리</figcaption><audio controls preload="metadata" src="previews/sound-after.mp3"></audio></figure></div></main><script>for(const a of document.querySelectorAll('audio'))a.addEventListener('play',()=>{for(const b of document.querySelectorAll('audio'))if(a!==b)b.pause();});</script></html>
